version: '3.8'

services:
  bot:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      # If using an external database like AWS RDS (Postgres), uncomment and set DATABASE_URL
      # - DATABASE_URL=postgresql://user:password@host:5432/dbname
