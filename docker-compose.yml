services:
  bot:
    build: .
    container_name: expentrax-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=expentrax
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - METRICS_PORT=9090
      - PORT=8000
      - BOT_TOKEN=${BOT_TOKEN:-}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - SECRET_TOKEN=${SECRET_TOKEN:-}
    ports:
      - "8000:8000"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - expentrax-net

  postgres:
    image: postgres:16-alpine
    container_name: expentrax-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: expentrax
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expentrax"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - expentrax-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: expentrax-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/expentrax?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - expentrax-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: expentrax-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - expentrax-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: expentrax-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - expentrax-net

  grafana:
    image: grafana/grafana:11.0.0
    container_name: expentrax-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - expentrax-net

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  expentrax-net:
    driver: bridge
