global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "expentrax-bot"
    scrape_interval: 5s
    static_configs:
      - targets: ["bot:9090"]

  - job_name: "postgres"
    scrape_interval: 10s
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "cadvisor"
    scrape_interval: 10s
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["localhost:9090"]
